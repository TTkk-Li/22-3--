<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForum - 游戏爱好者的交流天堂</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
  <!-- 引入字体图标 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="nav">
    <div class="container">
      <a href="index.html" class="logo">GameForum</a>
      <ul class="nav-list">
        <li><a href="index.html"><i class="fas fa-home"></i> 首页</a></li>
        <li><a href="#"><i class="fas fa-fire"></i> 热门</a></li>
        <li><a href="#"><i class="fas fa-trophy"></i> 赛事</a></li>
        <li><a href="#"><i class="fas fa-gamepad"></i> 游戏库</a></li>
        <li><a href="login.html"><i class="fas fa-user-circle"></i> 登录/注册</a></li>
      </ul>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="搜索游戏、帖子、用户...">
        <button class="search-btn"><i class="fas fa-search"></i> 搜索</button>
      </div>
    </div>
  </nav>

  <!-- 左侧悬浮版块侧边栏 - 核心新增 -->
  <div class="sidebar-categories">
    <div class="sidebar-header">
      <i class="fas fa-th-large"></i>
      <span class="title">版块分类</span>
    </div>
    <div class="categories-scroll" id="sidebar-categories-list">
      <!-- 动态渲染版块 -->
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="main">
    <div class="container">
      <!-- 轮播图 -->
      <div class="banner">
        <img src="images/banner.jpg" alt="游戏论坛banner">
      </div>

      <!-- 精选内容 -->
      <section class="featured card">
        <div class="card-header">精选内容</div>
        <div class="card-body">
          <div class="featured-list">
            <div class="featured-item">
              <img src="https://picsum.photos/800/400?random=1" alt="精选1">
              <div class="title">2024年最值得玩的10款单机游戏</div>
            </div>
            <div class="featured-item">
              <img src="https://picsum.photos/800/400?random=2" alt="精选2">
              <div class="title">英雄联盟S14全球总决赛分析</div>
            </div>
            <div class="featured-item">
              <img src="https://picsum.photos/800/400?random=3" alt="精选3">
              <div class="title">原神4.2版本新角色与剧情解析</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 移除旧的版块分类区域 -->

      <!-- 帖子列表 -->
      <section class="post-list">
        <div class="post-main">
          <div class="card">
            <div class="card-header">最新帖子</div>
            <div class="card-body" id="post-list-container">
              <!-- 动态渲染帖子列表 -->
            </div>
          </div>

          <!-- 分页 -->
          <ul class="pagination" id="pagination-container">
            <!-- 动态渲染分页 -->
          </ul>
        </div>

        <!-- 侧边栏 -->
        <div class="sidebar">
          <!-- 用户信息/登录提示 -->
          <div class="card post-sidebar-card" id="user-sidebar-card">
            <!-- 动态渲染用户信息 -->
          </div>

          <!-- 移除热门排行区域 -->
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
