<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布帖子 - GameForum</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/publish-post.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="nav">
    <div class="container">
      <a href="index.html" class="logo">GameForum</a>
      <ul class="nav-list">
        <li><a href="index.html"><i class="fas fa-home"></i> 首页</a></li>
        <li><a href="#"><i class="fas fa-fire"></i> 热门</a></li>
        <li><a href="#"><i class="fas fa-trophy"></i> 赛事</a></li>
        <li><a href="#"><i class="fas fa-gamepad"></i> 游戏库</a></li>
        <li><a href="#"><i class="fas fa-user-circle"></i> 我的</a></li>
      </ul>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="搜索游戏、帖子、用户...">
        <button class="search-btn"><i class="fas fa-search"></i> 搜索</button>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main">
    <div class="container">
      <div class="publish-container">
        <h2 style="margin-bottom: 20px; font-size: 24px;">发布新帖子</h2>
        
        <form id="publish-form">
          <!-- 帖子标题 -->
          <div class="form-group">
            <label for="post-title" class="form-label">帖子标题</label>
            <input type="text" id="post-title" class="form-control" placeholder="请输入帖子标题（不少于5个字）">
          </div>

          <!-- 版块选择 -->
          <div class="form-group">
            <label for="post-category" class="form-label">选择版块</label>
            <select id="post-category" class="form-control">
              <option value="">请选择版块</option>
              <option value="1">热门网游</option>
              <option value="2">单机游戏</option>
              <option value="3">手机游戏</option>
              <option value="4">电竞赛事</option>
              <option value="5">游戏攻略</option>
              <option value="6">闲聊杂谈</option>
              <option value="7">交易专区</option>
              <option value="8">问题求助</option>
            </select>
          </div>

          <!-- 帖子内容 -->
          <div class="form-group">
            <label for="post-content" class="form-label">帖子内容</label>
            <textarea id="post-content" class="form-control" placeholder="请输入帖子内容..."></textarea>
          </div>

          <!-- 文件上传 -->
          <div class="form-group">
            <label class="form-label">上传附件（图片/视频/文件）</label>
            <div class="upload-area" id="upload-area">
              <input type="file" id="file-input" multiple accept="image/*,video/*,.zip,.rar,.txt">
              <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
              <div class="upload-text">点击或拖拽文件到此处上传</div>
            </div>
          </div>

          <!-- 预览区域 -->
          <div class="preview-area">
            <div class="preview-title">预览</div>
            <div class="preview-list" id="preview-list"></div>
          </div>

          <!-- 发布按钮 -->
          <button type="button" class="btn btn-success publish-btn" id="publish-btn">发布帖子</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/publish-post.js"></script>
</body>
</html>
