<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录 - GameForum</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="nav">
    <div class="container">
      <a href="index.html" class="logo">GameForum</a>
      <ul class="nav-list">
        <li><a href="index.html"><i class="fas fa-home"></i> 首页</a></li>
        <li><a href="#"><i class="fas fa-fire"></i> 热门</a></li>
        <li><a href="#"><i class="fas fa-trophy"></i> 赛事</a></li>
        <li><a href="#"><i class="fas fa-gamepad"></i> 游戏库</a></li>
        <li><a href="login.html"><i class="fas fa-user-circle"></i> 登录/注册</a></li>
      </ul>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="搜索游戏、帖子、用户...">
        <button class="search-btn"><i class="fas fa-search"></i> 搜索</button>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main">
    <div class="auth-container">
      <h2 class="auth-title">用户登录</h2>
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username" class="form-label">用户名</label>
          <input type="text" id="username" class="form-control" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">密码</label>
          <input type="password" id="password" class="form-control" placeholder="请输入密码">
          <div id="login-error" class="error-tip"></div>
        </div>
        <button type="submit" class="auth-btn">登录</button>
      </form>
      <div class="auth-switch">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
